<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D Bau-Spiel – Final</title>
<style>
    body { margin: 0; overflow: hidden; background: #222; }
    canvas { background: #66aaff; display: block; }
    #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
    }
    #ui button {
        margin-right: 5px;
    }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
    <button onclick="saveLevel()">Speichern</button>
    <button onclick="loadLevel()">Laden</button>
    <button onclick="clearLevel()">Löschen</button>
</div>

<script>
// ---------------------------------------------------------
// CANVAS SETUP
// ---------------------------------------------------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", () => {
    resize();
    generateGround();
});
resize();

// ---------------------------------------------------------
// WELT & BLOCKTYPEN
// ---------------------------------------------------------
const tileSize = 40;
const world = {}; // "x,y" -> blockType

const blockTypes = {
    grass: "#00aa00",
    stone: "#777777",
    wood: "#8b5a2b",
    sand: "#d2b48c",
    snow: "#e0f7ff"
};

// ---------------------------------------------------------
// BIOME
// ---------------------------------------------------------
const biomes = [
    { name: "forest", color: "#00aa00", ground: "grass", weatherChance: { rain: 0.4, snow: 0.1 }, enemySpeed: 1 },
    { name: "desert", color: "#d2b48c", ground: "sand", weatherChance: { rain: 0.05, snow: 0 }, enemySpeed: 1.3 },
    { name: "snow", color: "#e0f7ff", ground: "snow", weatherChance: { rain: 0.1, snow: 0.6 }, enemySpeed: 0.7 },
    { name: "mountains", color: "#888888", ground: "stone", weatherChance: { rain: 0.2, snow: 0.3 }, enemySpeed: 0.9 }
];

function getBiomeAt(xTile) {
    const index = Math.floor(xTile / 20) % biomes.length;
    return biomes[(index + biomes.length) % biomes.length];
}

// ---------------------------------------------------------
// BODEN GENERIEREN
// ---------------------------------------------------------
function generateGround() {
    const groundY = Math.floor(canvas.height / tileSize) - 3;

    for (let x = 0; x < Math.floor(canvas.width / tileSize); x++) {
        const biome = getBiomeAt(x);

        world[`${x},${groundY}`] = biome.ground;
        world[`${x},${groundY + 1}`] = biome.ground;
        world[`${x},${groundY + 2}`] = biome.ground;
    }
}

function setBlock(x, y, type) {
    world[`${x},${y}`] = type;
    quests[0].progress++;
}

function removeBlock(x, y) {
    const groundY = Math.floor(canvas.height / tileSize) - 3;
    if (y >= groundY) return;
    delete world[`${x},${y}`];
}

function drawWorld() {
    for (const key in world) {
        const [x, y] = key.split(",").map(Number);
        const biome = getBiomeAt(x);
        ctx.fillStyle = blockTypes[world[key]] || biome.color;
        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }
}

// ---------------------------------------------------------
// SPIELER
// ---------------------------------------------------------
const player = {
    x: 5 * tileSize,
    y: 2 * tileSize,
    vx: 0,
    vy: 0,
    w: 30,
    h: 40,
    onGround: false,
    hp: 10
};

const keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// ---------------------------------------------------------
// 4-RICHTUNGEN-BAUSYSTEM
// ---------------------------------------------------------
let buildDir = "down";

document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") buildDir = "up";
    if (e.key === "ArrowDown") buildDir = "down";
    if (e.key === "ArrowLeft") buildDir = "left";
    if (e.key === "ArrowRight") buildDir = "right";

    const px = Math.floor((player.x + player.w / 2) / tileSize);
    const py = Math.floor((player.y + player.h / 2) / tileSize);

    let tx = px;
    let ty = py;

    if (buildDir === "up") ty -= 1;
    if (buildDir === "down") ty += 1;
    if (buildDir === "left") tx -= 1;
    if (buildDir === "right") tx += 1;

    if (e.key === "f") setBlock(tx, ty, "grass");
    if (e.key === "g") setBlock(tx, ty, "stone");
    if (e.key === "h") setBlock(tx, ty, "wood");
    if (e.key === "r") removeBlock(tx, ty);
});

// ---------------------------------------------------------
// PHYSIK
// ---------------------------------------------------------
function physics() {
    player.vy += 0.5;

    if (keys["a"] || keys["A"]) player.vx = -3;
    else if (keys["d"] || keys["D"]) player.vx = 3;
    else player.vx = 0;

    if ((keys["w"] || keys["W"]) && player.onGround) {
        player.vy = -10;
        player.onGround = false;
    }

    player.x += player.vx;
    player.y += player.vy;

    const footX = Math.floor(player.x / tileSize);
    const footY = Math.floor((player.y + player.h) / tileSize);

    if (world[`${footX},${footY}`]) {
        player.y = footY * tileSize - player.h;
        player.vy = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }
}

function drawPlayer() {
    ctx.fillStyle = "yellow";
    ctx.fillRect(player.x, player.y, player.w, player.h);
}

// ---------------------------------------------------------
// WETTER
// ---------------------------------------------------------
let weather = "clear";
let weatherIntensity = 0;
let particles = [];

setInterval(() => {
    const biome = getBiomeAt(Math.floor(player.x / tileSize));
    const r = Math.random();

    if (r < biome.weatherChance.rain) {
        weather = "rain";
        weatherIntensity = Math.random() * 0.7 + 0.3;
    } else if (r < biome.weatherChance.rain + biome.weatherChance.snow) {
        weather = "snow";
        weatherIntensity = Math.random() * 0.7 + 0.3;
    } else {
        weather = "clear";
        weatherIntensity = 0;
    }
}, 15000);

function spawnWeatherParticles() {
    if (weather === "clear") return;

    for (let i = 0; i < 5 * weatherIntensity; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: -10,
            vx: weather === "snow" ? (Math.random() - 0.5) * 0.5 : 0,
            vy: weather === "snow" ? 1 + Math.random() : 8 + Math.random() * 4,
            size: weather === "snow" ? 3 : 2
        });
    }
}

function updateWeatherParticles() {
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
    });
    particles = particles.filter(p => p.y < canvas.height + 20);
}

function drawWeatherParticles() {
    if (weather === "rain") ctx.fillStyle = "rgba(150,150,255,0.7)";
    if (weather === "snow") ctx.fillStyle = "white";

    particles.forEach(p => {
        ctx.fillRect(p.x, p.y, p.size, p.size * (weather === "rain" ? 4 : 1));
    });
}

function drawClouds() {
    if (weather === "clear") return;
    ctx.fillStyle = `rgba(200,200,200,${weatherIntensity * 0.25})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ---------------------------------------------------------
// FEINDE
// ---------------------------------------------------------
const enemies = [
    { x: 300, y: 200, vx: 1, vy: 0, w: 30, h: 30, alive: true }
];

function getEnemyModifiers() {
    const biome = getBiomeAt(Math.floor(player.x / tileSize));

    let speed = biome.enemySpeed;
    let jump = 1;
    let push = 0;

    if (weather === "rain") speed *= 1.2;
    if (weather === "snow") speed *= 0.8;

    if (weather !== "clear") {
        push = (Math.random() - 0.5) * 0.2 * weatherIntensity;
    }

    return { speed, jump, push };
}

function updateEnemies() {
    const mod = getEnemyModifiers();

    enemies.forEach(e => {
        if (!e.alive) return;

        e.vy += 0.4;
        e.x += e.vx * mod.speed;
        e.y += e.vy;

        e.x += mod.push;

        const footX = Math.floor(e.x / tileSize);
        const footY = Math.floor((e.y + e.h) / tileSize);
        if (world[`${footX},${footY}`]) {
            e.y = footY * tileSize - e.h;
            e.vy = 0;

            if (Math.random() < 0.01 * mod.jump) {
                e.vy = -8 * mod.jump;
            }
        }

        const frontX = Math.floor((e.x + (e.vx > 0 ? e.w : -1)) / tileSize);
        const frontY = Math.floor((e.y + e.h / 2) / tileSize);
        if (world[`${frontX},${frontY}`]) e.vx *= -1;

        if (player.x < e.x + e.w &&
            player.x + player.w > e.x &&
            player.y < e.y + e.h &&
            player.y + player.h > e.y) {

            if (player.vy > 0) {
                if (e.alive) {
                    e.alive = false;
                    player.vy = -8;
                    quests[1].progress++;
                }
            } else {
                player.hp -= 1 * mod.speed;
            }
        }
    });
}

function drawEnemies() {
    enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = "purple";
        ctx.fillRect(e.x, e.y, e.w, e.h);
    });
}

// ---------------------------------------------------------
// QUESTS
// ---------------------------------------------------------
let quests = [
    { id: 1, text: "Baue 10 Blöcke", progress: 0, goal: 10 },
    { id: 2, text: "Besiege 1 Feind", progress: 0, goal: 1 }
];

function drawQuests() {
    ctx.fillStyle = "white";
    ctx.font = "16px Arial";
    let y = 25;

    quests.forEach(q => {
        const done = q.progress >= q.goal;
        const status = done ? "✔" : `${q.progress}/${q.goal}`;
        ctx.fillText(q.text + ": " + status, 20, y);
        y += 20;
    });

    ctx.fillText("HP: " + Math.max(0, Math.floor(player.hp)), 20, y + 10);
}

// ---------------------------------------------------------
// SPEICHERN / LADEN / AUTOSAVE
// ---------------------------------------------------------
function saveLevel() {
    const saveObj = {
        world: world,
        playerX: player.x,
        playerY: player.y,
        playerHp: player.hp,
        weather,
        weatherIntensity,
        quests
    };
    localStorage.setItem("levelData", JSON.stringify(saveObj));
    alert("Level gespeichert!");
}

function loadLevel() {
    const data = localStorage.getItem("levelData");
    if (data) {
        const loaded = JSON.parse(data);

        for (const key in world) delete world[key];
        Object.assign(world, loaded.world || {});

        if (loaded.playerX !== undefined) player.x = loaded.playerX;
        if (loaded.playerY !== undefined) player.y = loaded.playerY;
        if (loaded.playerHp !== undefined) player.hp = loaded.playerHp;

        if (loaded.weather !== undefined) weather = loaded.weather;
        if (loaded.weatherIntensity !== undefined) weatherIntensity = loaded.weatherIntensity;
        if (loaded.quests !== undefined) quests = loaded.quests;

        generateGround();
        alert("Level geladen!");
    } else {
        alert("Kein gespeichertes Level gefunden.");
    }
}

function clearLevel() {
    localStorage.removeItem("levelData");
    alert("Level gelöscht!");
}

setInterval(() => {
    const saveObj = {
        world: world,
        playerX: player.x,
        playerY: player.y,
        playerHp: player.hp,
        weather,
        weatherIntensity,
        quests
    };
    localStorage.setItem("levelData", JSON.stringify(saveObj));
}, 5000);

// ---------------------------------------------------------
// GAME LOOP
// ---------------------------------------------------------
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    physics();
    updateEnemies();
    spawnWeatherParticles();
    updateWeatherParticles();

    drawWorld();
    drawEnemies();
    drawPlayer();
    drawQuests();
    drawClouds();
    drawWeatherParticles();

    requestAnimationFrame(loop);
}

generateGround();
loop();
</script>

</body>
</html>
