<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D Bau-Spiel – Kamera Version</title>
<style>
    body { margin: 0; overflow: hidden; background: #222; }
    canvas { background: #66aaff; display: block; }
    #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
    }
    #ui button { margin-right: 5px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
    <button onclick="saveLevel()">Speichern</button>
    <button onclick="loadLevel()">Laden</button>
    <button onclick="clearLevel()">Löschen</button>
</div>

<script>
// ---------------------------------------------------------
// CANVAS
// ---------------------------------------------------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", () => { resize(); generateGround(); });
resize();

// ---------------------------------------------------------
// KAMERA
// ---------------------------------------------------------
let camX = 0;
let camY = 0;

// ---------------------------------------------------------
// WELT
// ---------------------------------------------------------
const tileSize = 40;
const world = {};

const blockTypes = {
    grass: "#00aa00",
    stone: "#777777",
    wood: "#8b5a2b",
    sand: "#d2b48c",
    snow: "#e0f7ff"
};

// ---------------------------------------------------------
// BIOME
// ---------------------------------------------------------
const biomes = [
    { name: "forest", color: "#00aa00", ground: "grass", weatherChance: { rain: 0.4, snow: 0.1 }, enemySpeed: 1 },
    { name: "desert", color: "#d2b48c", ground: "sand", weatherChance: { rain: 0.05, snow: 0 }, enemySpeed: 1.3 },
    { name: "snow", color: "#e0f7ff", ground: "snow", weatherChance: { rain: 0.1, snow: 0.6 }, enemySpeed: 0.7 },
    { name: "mountains", color: "#888888", ground: "stone", weatherChance: { rain: 0.2, snow: 0.3 }, enemySpeed: 0.9 }
];

function getBiomeAt(xTile) {
    const index = Math.floor(xTile / 20) % biomes.length;
    return biomes[(index + biomes.length) % biomes.length];
}

// ---------------------------------------------------------
// BODEN
// ---------------------------------------------------------
function generateGround() {
    const groundY = Math.floor(canvas.height / tileSize) - 3;

    for (let x = -200; x < 200; x++) {
        const biome = getBiomeAt(x);
        world[`${x},${groundY}`] = biome.ground;
        world[`${x},${groundY+1}`] = biome.ground;
        world[`${x},${groundY+2}`] = biome.ground;
    }
}

function setBlock(x, y, type) {
    world[`${x},${y}`] = type;
    quests[0].progress++;
}

function removeBlock(x, y) {
    const groundY = Math.floor(canvas.height / tileSize) - 3;
    if (y >= groundY) return;
    delete world[`${x},${y}`];
}

function drawWorld() {
    for (const key in world) {
        const [x, y] = key.split(",").map(Number);
        const biome = getBiomeAt(x);
        ctx.fillStyle = blockTypes[world[key]] || biome.color;
        ctx.fillRect(x * tileSize - camX, y * tileSize - camY, tileSize, tileSize);
    }
}

// ---------------------------------------------------------
// SPIELER
// ---------------------------------------------------------
const player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    w: 30,
    h: 40,
    onGround: false,
    hp: 10
};

player.x = 0;
player.y = -200;

const keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// ---------------------------------------------------------
// BAUSYSTEM (4 Richtungen)
// ---------------------------------------------------------
let buildDir = "down";

document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") buildDir = "up";
    if (e.key === "ArrowDown") buildDir = "down";
    if (e.key === "ArrowLeft") buildDir = "left";
    if (e.key === "ArrowRight") buildDir = "right";

    const px = Math.floor(player.x / tileSize);
    const py = Math.floor(player.y / tileSize);

    let tx = px, ty = py;

    if (buildDir === "up") ty--;
    if (buildDir === "down") ty++;
    if (buildDir === "left") tx--;
    if (buildDir === "right") tx++;

    if (e.key === "f") setBlock(tx, ty, "grass");
    if (e.key === "g") setBlock(tx, ty, "stone");
    if (e.key === "h") setBlock(tx, ty, "wood");
    if (e.key === "r") removeBlock(tx, ty);
});

// ---------------------------------------------------------
// PHYSIK
// ---------------------------------------------------------
function physics() {
    player.vy += 0.5;

    if (keys["a"] || keys["A"]) player.vx = -3;
    else if (keys["d"] || keys["D"]) player.vx = 3;
    else player.vx = 0;

    if ((keys["w"] || keys["W"]) && player.onGround) {
        player.vy = -10;
        player.onGround = false;
    }

    player.x += player.vx;
    player.y += player.vy;

    const footX = Math.floor(player.x / tileSize);
    const footY = Math.floor((player.y + player.h) / tileSize);

    if (world[`${footX},${footY}`]) {
        player.y = footY * tileSize - player.h;
        player.vy = 0;
        player.onGround = true;
    } else player.onGround = false;
}

function drawPlayer() {
    ctx.fillStyle = "yellow";
    ctx.fillRect(player.x - camX, player.y - camY, player.w, player.h);
}

// ---------------------------------------------------------
// WETTER
// ---------------------------------------------------------
let weather = "clear";
let weatherIntensity = 0;
let particles = [];

setInterval(() => {
    const biome = getBiomeAt(Math.floor(player.x / tileSize));
    const r = Math.random();

    if (r < biome.weatherChance.rain) {
        weather = "rain";
        weatherIntensity = Math.random() * 0.7 + 0.3;
    } else if (r < biome.weatherChance.rain + biome.weatherChance.snow) {
        weather = "snow";
        weatherIntensity = Math.random() * 0.7 + 0.3;
    } else {
        weather = "clear";
        weatherIntensity = 0;
    }
}, 15000);

function spawnWeatherParticles() {
    if (weather === "clear") return;

    for (let i = 0; i < 5 * weatherIntensity; i++) {
        particles.push({
            x: camX + Math.random() * canvas.width,
            y: camY - 10,
            vx: weather === "snow" ? (Math.random() - 0.5) * 0.5 : 0,
            vy: weather === "snow" ? 1 + Math.random() : 8 + Math.random() * 4,
            size: weather === "snow" ? 3 : 2
        });
    }
}

function updateWeatherParticles() {
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; });
    particles = particles.filter(p => p.y < camY + canvas.height + 20);
}

function drawWeatherParticles() {
    ctx.fillStyle = weather === "rain" ? "rgba(150,150,255,0.7)" : "white";

    particles.forEach(p => {
        ctx.fillRect(p.x - camX, p.y - camY, p.size, p.size * (weather === "rain" ? 4 : 1));
    });
}

function drawClouds() {
    if (weather === "clear") return;
    ctx.fillStyle = `rgba(200,200,200,${weatherIntensity * 0.25})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ---------------------------------------------------------
// FEINDE
// ---------------------------------------------------------
const enemies = [
    { x: 200, y: -200, vx: 1, vy: 0, w: 30, h: 30, alive: true }
];

function getEnemyModifiers() {
    const biome = getBiomeAt(Math.floor(player.x / tileSize));
    let speed = biome.enemySpeed;
    let jump = 1;
    let push = 0;

    if (weather === "rain") speed *= 1.2;
    if (weather === "snow") speed *= 0.8;

    if (weather !== "clear") push = (Math.random() - 0.5) * 0.2 * weatherIntensity;

    return { speed, jump, push };
}

function updateEnemies() {
    const mod = getEnemyModifiers();

    enemies.forEach(e => {
        if (!e.alive) return;

        e.vy += 0.4;
        e.x += e.vx * mod.speed;
        e.y += e.vy;
        e.x += mod.push;

        const footX = Math.floor(e.x / tileSize);
        const footY = Math.floor((e.y + e.h) / tileSize);

        if (world[`${footX},${footY}`]) {
            e.y = footY * tileSize - e.h;
            e.vy = 0;
            if (Math.random() < 0.01 * mod.jump) e.vy = -8 * mod.jump;
        }

        const frontX = Math.floor((e.x + (e.vx > 0 ? e.w : -1)) / tileSize);
        const frontY = Math.floor((e.y + e.h / 2) / tileSize);
        if (world[`${frontX},${frontY}`]) e.vx *= -1;

        if (player.x < e.x + e.w &&
            player.x + player.w > e.x &&
            player.y < e.y + e.h &&
            player.y + player.h > e.y) {

            if (player.vy > 0) {
                e.alive = false;
                player.vy = -8;
                quests[1].progress++;
            } else {
                player.hp -= 1 * mod.speed;
            }
        }
    });
}

function drawEnemies() {
    enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = "purple";
        ctx.fillRect(e.x - camX, e.y - camY, e.w, e.h);
    });
}

// ---------------------------------------------------------
// QUESTS (fixiert, Kamera ignoriert)
// ---------------------------------------------------------
let quests = [
    { id: 1, text: "Baue 10 Blöcke", progress: 0, goal: 10 },
    { id: 2, text: "Besiege 1 Feind", progress: 0, goal: 1 }
];

function drawQuests() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    ctx.fillStyle = "white";
    ctx.font = "16px Arial";

    let y = 25;
    quests.forEach(q => {
        const done = q.progress >= q.goal;
        ctx.fillText(q.text + ": " + (done ? "✔" : `${q.progress}/${q.goal}`), 20, y);
        y += 20;
    });

    ctx.fillText("HP: " + Math.floor(player.hp), 20, y + 10);

    ctx.restore();
}

// ---------------------------------------------------------
// SPEICHERN / LADEN
// ---------------------------------------------------------
function saveLevel() {
    const saveObj = {
        world,
        playerX: player.x,
        playerY: player.y,
        playerHp: player.hp,
        weather,
        weatherIntensity,
        quests
    };
    localStorage.setItem("levelData", JSON.stringify(saveObj));
    alert("Level gespeichert!");
}

function loadLevel() {
    const data = localStorage.getItem("levelData");
    if (!data) return alert("Kein gespeichertes Level gefunden.");

    const loaded = JSON.parse(data);

    for (const key in world) delete world[key];
    Object.assign(world, loaded.world);

    player.x = loaded.playerX;
    player.y = loaded.playerY;
    player.hp = loaded.playerHp;

    weather = loaded.weather;
    weatherIntensity = loaded.weatherIntensity;
    quests = loaded.quests;

    alert("Level geladen!");
}

function clearLevel() {
    localStorage.removeItem("levelData");
    alert("Level gelöscht!");
}

setInterval(() => {
    saveLevel();
}, 5000);

// ---------------------------------------------------------
// GAME LOOP
// ---------------------------------------------------------
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    camX = player.x - canvas.width / 2;
    camY = player.y - canvas.height / 2;

    physics();
    updateEnemies();
    spawnWeatherParticles();
    updateWeatherParticles();

    drawWorld();
    drawEnemies();
    drawPlayer();
    drawClouds();
    drawWeatherParticles();
    drawQuests();

    requestAnimationFrame(loop);
}

generateGround();
loop();
</script>

</body>
</html>
