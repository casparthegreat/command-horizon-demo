<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Command Horizon – Browser Demo</title>
<style>
    body {
        margin: 0;
        background: #050814;
        color: #e0f0ff;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }
    #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
    }
    button {
        background: #174a9c;
        border: none;
        padding: 10px 14px;
        margin-bottom: 6px;
        color: white;
        cursor: pointer;
        border-radius: 4px;
        width: 160px;
        display: block;
    }
    button:hover {
        background: #1f63cf;
    }
</style>
</head>
<body>

<div id="ui">
    <button onclick="scanPing()">Scan‑Ping</button>
    <button onclick="setOrbit()">Drohnen Orbit</button>
    <button onclick="moveUnits()">Truppen bewegen</button>
    <button onclick="orbitalStrike()">Orbitalangriff</button>
</div>

<canvas id="game" width="900" height="600"></canvas>

<script>
// === CANVAS SETUP ===
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// === GAME OBJECTS ===
let units = [
    {name:"Alpha", x:100, y:300, color:"#4af"},
    {name:"Beta", x:150, y:350, color:"#4af"}
];

let drones = [
    {name:"D1", x:120, y:260, angle:0, color:"#0ff"},
    {name:"D2", x:180, y:260, angle:180, color:"#0ff"}
];

let enemies = [
    {name:"E1", x:600, y:200, color:"#f44"},
    {name:"E2", x:650, y:250, color:"#f44"},
    {name:"Mech", x:700, y:350, color:"#f11", big:true}
];

let commander = {x:150, y:300};

// === GAME LOOP ===
function loop() {
    ctx.fillStyle = "#050814";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawUnits();
    drawDrones();
    drawEnemies();

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// === DRAW FUNCTIONS ===
function drawUnits() {
    for (let u of units) {
        ctx.fillStyle = u.color;
        ctx.beginPath();
        ctx.arc(u.x, u.y, 12, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawDrones() {
    for (let d of drones) {
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, 8, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawEnemies() {
    for (let e of enemies) {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.big ? 20 : 12, 0, Math.PI*2);
        ctx.fill();
    }
}

// === ACTIONS ===

// 1. SCAN PING
function scanPing() {
    ctx.strokeStyle = "#0ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(commander.x, commander.y, 200, 0, Math.PI*2);
    ctx.stroke();

    enemies.forEach(e => {
        if (distance(commander, e) < 200) {
            flash(e, "#0ff");
        }
    });
}

// 2. DRONE ORBIT
function setOrbit() {
    let radius = 60;
    drones.forEach((d, i) => {
        let angle = (i / drones.length) * Math.PI * 2;
        d.x = commander.x + Math.cos(angle) * radius;
        d.y = commander.y + Math.sin(angle) * radius;
    });
}

// 3. MOVE UNITS
function moveUnits() {
    units.forEach(u => {
        u.x += 200;
    });
    drones.forEach(d => {
        d.x += 200;
    });
    commander.x += 200;
}

// 4. ORBITAL STRIKE
function orbitalStrike() {
    let target = enemies[2]; // Mech
    flash(target, "#fff");

    setTimeout(() => {
        enemies = enemies.filter(e => e !== target);
    }, 300);
}

// === HELPERS ===
function distance(a,b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}

function flash(obj, color) {
    let old = obj.color;
    obj.color = color;
    setTimeout(() => obj.color = old, 200);
}
</script>

</body>
</html>
