<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Blockkampf</title>
  <style>
    body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { background: #333; border: 2px solid #fff; }
  </style>
</head>
<body>
<canvas id="game" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const gravity = 0.6;
const groundY = 300;

let gameOver = false;

// LEVELSYSTEM
let level = 1;
let levelScreen = true;
let levelScreenTimer = 1500;

// COUNTDOWN + FLASH
let countdown = 3;
let countdownActive = true;
let flash = false;

const countdownInterval = setInterval(() => {
  countdown--;
  if (countdown <= 0) {
    countdownActive = false;
    flash = true;
    setTimeout(() => flash = false, 150);
    clearInterval(countdownInterval);
  }
}, 1000);

// SPIELER
const player = {
  x: 100,
  y: groundY - 40,
  w: 40,
  h: 40,
  vy: 0,
  onGround: true,
  color: 'red',
  hp: 3
};

// GEGNER
const enemies = [];
const stars = [];
const enemyStars = [];

// INPUT
const keys = { left: false, right: false, jump: false, shootLeft: false, shootRight: false, shootUp: false, shootDown: false };

document.addEventListener('keydown', (e) => {
  if (e.code === 'KeyA') keys.left = true;
  if (e.code === 'KeyD') keys.right = true;
  if (e.code === 'Space') keys.jump = true;

  if (e.code === 'KeyA') keys.shootLeft = true;
  if (e.code === 'KeyD') keys.shootRight = true;
  if (e.code === 'KeyW') keys.shootUp = true;
  if (e.code === 'KeyS') keys.shootDown = true;

  if (e.code === 'KeyR' && gameOver) location.reload();
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'KeyA') { keys.left = false; keys.shootLeft = false; }
  if (e.code === 'KeyD') { keys.right = false; keys.shootRight = false; }
  if (e.code === 'KeyW') keys.shootUp = false;
  if (e.code === 'KeyS') keys.shootDown = false;
  if (e.code === 'Space') keys.jump = false;
});

// KOLLISION
function rectsCollide(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

let canShoot = true;

function shootStar(vx, vy) {
  stars.push({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2,
    r: 6,
    vx: vx,
    vy: vy,
    color: 'yellow'
  });
}

// GEGNERTYPEN (Tank entfernt)
const enemyTypes = ["melee", "sniper", "flyer"];

function randomType() {
  return enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
}

// BOSS
function createBoss(x, y) {
  return {
    x: x,
    y: y,
    w: 80,
    h: 80,
    hp: 20 + level * 3,
    speed: 1 + level * 0.1,
    lastShot: 0,
    type: "boss"
  };
}

// NORMALER GEGNER
function createEnemy(type, x, y) {
  const base = {
    x: x,
    y: y,
    w: 40,
    h: 40,
    hp: 3 + level,
    speed: 2 + level * 0.1,
    lastShot: 0,
    type: type
  };

  // LEVEL 1 EXTREM EINFACH
  if (level === 1) {
    base.hp = 1;
    base.speed = 1;
  }

  if (type === "melee") base.speed += 1;
  if (type === "sniper") base.speed -= 1;
  if (type === "flyer") base.y -= 120;

  return base;
}

// LEVEL STARTEN
function spawnLevel() {
  enemies.length = 0;

  for (let i = 0; i < 3; i++) {
    const x = 600 + i * -100;
    const y = groundY - 40;

    // Level 1: KEIN Boss
    if (level > 1 && Math.random() < 0.10) {
      enemies.push(createBoss(x, y));
    } else {
      enemies.push(createEnemy(randomType(), x, y));
    }
  }

  levelScreen = true;
  levelScreenTimer = 1500;
}

// GEGNER SCHIEßT
function enemyShoot(enemy) {
  const dx = (player.x + player.w / 2) - (enemy.x + enemy.w / 2);
  const dy = (player.y + player.h / 2) - (enemy.y + enemy.h / 2);

  let vx = 0, vy = 0;

  if (Math.abs(dx) > Math.abs(dy)) vx = dx > 0 ? 6 : -6;
  else vy = dy > 0 ? 6 : -6;

  enemyStars.push({
    x: enemy.x + enemy.w / 2,
    y: enemy.y + enemy.h / 2,
    r: 6,
    vx: vx,
    vy: vy,
    color: 'white'
  });
}

// UPDATE
function update() {
  if (gameOver || countdownActive) return;

  if (levelScreen) {
    levelScreenTimer -= 16;
    if (levelScreenTimer <= 0) levelScreen = false;
    return;
  }

  // SPIELER BEWEGUNG
  if (keys.left) player.x -= 4;
  if (keys.right) player.x += 4;

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  if (keys.jump && player.onGround) {
    player.vy = -12;
    player.onGround = false;
  }

  player.vy += gravity;
  player.y += player.vy;

  if (player.y + player.h > groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.onGround = true;
  }

  // SCHIEßEN
  if (canShoot) {
    if (keys.shootLeft)  { shootStar(-8, 0); canShoot = false; }
    if (keys.shootRight) { shootStar(8, 0);  canShoot = false; }
    if (keys.shootUp)    { shootStar(0, -8); canShoot = false; }
    if (keys.shootDown)  { shootStar(0, 8);  canShoot = false; }

    if (!canShoot) setTimeout(() => canShoot = true, 200);
  }

  // SPIELER-PROJEKTILE
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.x += s.vx;
    s.y += s.vy;

    let hit = false;
    for (const enemy of enemies) {
      if (enemy.hp <= 0) continue;
      if (rectsCollide({ x: s.x - s.r, y: s.y - s.r, w: s.r*2, h: s.r*2 }, enemy)) {
        enemy.hp--;
        hit = true;
        break;
      }
    }

    if (hit) { stars.splice(i, 1); continue; }

    if (s.x < 0 || s.x > canvas.width || s.y < 0 || s.y > canvas.height)
      stars.splice(i, 1);
  }

  // GEGNER UPDATE
  let aliveEnemies = 0;

  for (const enemy of enemies) {
    if (enemy.hp <= 0) continue;
    aliveEnemies++;

    if (enemy.type === "melee") enemy.x += enemy.x < player.x ? enemy.speed : -enemy.speed;
    if (enemy.type === "flyer") enemy.x += Math.sin(Date.now() / 500) * 2;

    if (enemy.x < 0) enemy.x = 0;
    if (enemy.x + enemy.w > canvas.width) enemy.x = canvas.width - enemy.w;

    let shootDelay = enemy.type === "boss" ? 500 : 1200;

    // Level 1: Gegner schießen extrem langsam
    if (level === 1) shootDelay = 2000;

    if (Date.now() - enemy.lastShot > shootDelay) {
      enemyShoot(enemy);
      enemy.lastShot = Date.now();
    }
  }

  // LEVEL GESCHAFFT
  if (aliveEnemies === 0) {
    level++;
    spawnLevel();
  }

  // GEGNER-PROJEKTILE
  for (let i = enemyStars.length - 1; i >= 0; i--) {
    const s = enemyStars[i];
    s.x += s.vx;
    s.y += s.vy;

    if (rectsCollide({ x: s.x - s.r, y: s.y - s.r, w: s.r*2, h: s.r*2 }, player)) {
      player.hp--;
      if (player.hp <= 0) gameOver = true;
      enemyStars.splice(i, 1);
