<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Blockkampf</title>
  <style>
    body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { background: #333; border: 2px solid #fff; }
  </style>
</head>
<body>
<canvas id="game" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const gravity = 0.6;
const groundY = 300;

let gameOver = false;
let win = false;

// Spieler
const player = {
  x: 100,
  y: groundY - 40,
  w: 40,
  h: 40,
  vy: 0,
  onGround: true,
  color: 'red',
  hp: 3
};

// Gegnerliste
const enemies = [];

// Projektile
const stars = [];
const enemyStars = [];

// Eingaben
const keys = { left: false, right: false, jump: false, shootLeft: false, shootRight: false, shootUp: false, shootDown: false };

document.addEventListener('keydown', (e) => {
  if (e.code === 'KeyA') keys.left = true;
  if (e.code === 'KeyD') keys.right = true;

  if (e.code === 'Space') keys.jump = true;

  if (e.code === 'KeyA') keys.shootLeft = true;
  if (e.code === 'KeyD') keys.shootRight = true;
  if (e.code === 'KeyW') keys.shootUp = true;
  if (e.code === 'KeyS') keys.shootDown = true;

  if (e.code === 'KeyR' && (gameOver || win)) location.reload();
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'KeyA') { keys.left = false; keys.shootLeft = false; }
  if (e.code === 'KeyD') { keys.right = false; keys.shootRight = false; }
  if (e.code === 'KeyW') keys.shootUp = false;
  if (e.code === 'KeyS') keys.shootDown = false;
  if (e.code === 'Space') keys.jump = false;
});

// Kollision
function rectsCollide(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

let canShoot = true;

function shootStar(vx, vy) {
  stars.push({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2,
    r: 6,
    vx: vx,
    vy: vy,
    color: 'yellow'
  });
}

// Gegnertypen erstellen
function createEnemy(type, x, y) {
  const base = {
    x: x,
    y: y,
    w: 40,
    h: 40,
    hp: 3,
    speed: 2,
    lastShot: 0,
    type: type
  };

  if (type === "melee") { base.hp = 2; base.speed = 3; }
  if (type === "sniper") { base.hp = 1; base.speed = 1; }
  if (type === "tank") { base.hp = 8; base.speed = 1; base.w = 60; base.h = 60; }
  if (type === "flyer") { base.hp = 2; base.speed = 2; base.y -= 120; }

  return base;
}

// Gegner spawnen
enemies.push(createEnemy("melee", 600, groundY - 40));
enemies.push(createEnemy("sniper", 700, groundY - 40));
enemies.push(createEnemy("tank", 500, groundY - 60));
enemies.push(createEnemy("flyer", 400, groundY - 40));

// Gegner schießt in Richtung Spieler
function enemyShoot(enemy) {
  const dx = (player.x + player.w / 2) - (enemy.x + enemy.w / 2);
  const dy = (player.y + player.h / 2) - (enemy.y + enemy.h / 2);

  let vx = 0, vy = 0;

  if (Math.abs(dx) > Math.abs(dy)) vx = dx > 0 ? 6 : -6;
  else vy = dy > 0 ? 6 : -6;

  enemyStars.push({
    x: enemy.x + enemy.w / 2,
    y: enemy.y + enemy.h / 2,
    r: 6,
    vx: vx,
    vy: vy,
    color: 'white'
  });
}

function update() {
  if (gameOver || win) return;

  // Bewegung Spieler
  if (keys.left) player.x -= 4;
  if (keys.right) player.x += 4;

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  if (keys.jump && player.onGround) {
    player.vy = -12;
    player.onGround = false;
  }

  player.vy += gravity;
  player.y += player.vy;

  if (player.y + player.h > groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.onGround = true;
  }

  // Spieler schießt
  if (canShoot) {
    if (keys.shootLeft)  { shootStar(-8, 0); canShoot = false; }
    if (keys.shootRight) { shootStar(8, 0);  canShoot = false; }
    if (keys.shootUp)    { shootStar(0, -8); canShoot = false; }
    if (keys.shootDown)  { shootStar(0, 8);  canShoot = false; }

    if (!canShoot) setTimeout(() => canShoot = true, 200);
  }

  // Spieler-Projektile
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.x += s.vx;
    s.y += s.vy;

    let hit = false;
    for (const enemy of enemies) {
      if (enemy.hp <= 0) continue;
      if (rectsCollide({ x: s.x - s.r, y: s.y - s.r, w: s.r*2, h: s.r*2 }, enemy)) {
        enemy.hp--;
        hit = true;
        break;
      }
    }

    if (hit) { stars.splice(i, 1); continue; }

    if (s.x < 0 || s.x > canvas.width || s.y < 0 || s.y > canvas.height)
      stars.splice(i, 1);
  }

  // Gegner bewegen + schießen
  let aliveEnemies = 0;

  for (const enemy of enemies) {
    if (enemy.hp <= 0) continue;
    aliveEnemies++;

    if (enemy.type === "melee") enemy.x += enemy.x < player.x ? enemy.speed : -enemy.speed;
    if (enemy.type === "tank") enemy.x -= enemy.speed;
    if (enemy.type === "flyer") enemy.x += Math.sin(Date.now() / 500) * 2;

    if (enemy.x < 0) enemy.x = 0;
    if (enemy.x + enemy.w > canvas.width) enemy.x = canvas.width - enemy.w;

    if (Date.now() - enemy.lastShot > 1200) {
      enemyShoot(enemy);
      enemy.lastShot = Date.now();
    }
  }

  if (aliveEnemies === 0) win = true;

  // Gegner-Projektile
  for (let i = enemyStars.length - 1; i >= 0; i--) {
    const s = enemyStars[i];
    s.x += s.vx;
    s.y += s.vy;

    if (rectsCollide({ x: s.x - s.r, y: s.y - s.r, w: s.r*2, h: s.r*2 }, player)) {
      player.hp--;
      if (player.hp <= 0) gameOver = true;
      enemyStars.splice(i, 1);
      continue;
    }

    if (s.x < 0 || s.x > canvas.width || s.y < 0 || s.y > canvas.height)
      enemyStars.splice(i, 1);
  }
}

// Stern zeichnen
function drawStar(x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r,
               -Math.sin((18 + i * 72) * Math.PI / 180) * r);
    ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 2),
               -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 2));
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const aliveEnemies = enemies.filter(e => e.hp > 0).length;

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Spieler Leben: " + player.hp, 20, 30);
  ctx.fillText("Gegner übrig: " + aliveEnemies, 20, 60);

  ctx.fillStyle = '#555';
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.w, player.h);

  for (const enemy of enemies) {
    if (enemy.hp <= 0) continue;

    ctx.fillStyle =
      enemy.type === "tank" ? "brown" :
      enemy.type === "sniper" ? "purple" :
      enemy.type === "flyer" ? "cyan" :
      "black";

    ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
  }

  stars.forEach(s => drawStar(s.x, s.y, s.r, s.color));
  enemyStars.forEach(s => drawStar(s.x, s.y, s.r, s.color));

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";
    ctx.font = "60px Arial";
    ctx.fillText("GAME OVER", canvas.width / 2 - 160, canvas.height / 2);
  }

  if (win) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "yellow";
    ctx.font = "60px Arial";
    ctx.fillText("YOU WIN!", canvas.width / 2 - 150, canvas.height / 2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
