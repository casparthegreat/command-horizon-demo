<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D Bau-Spiel</title>
<style>
    body { margin: 0; overflow: hidden; background: #222; }
    canvas { background: #66aaff; display: block; }
    #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
    }
    #ui button {
        margin-right: 5px;
    }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
    <button onclick="saveLevel()">Speichern</button>
    <button onclick="loadLevel()">Laden</button>
    <button onclick="clearLevel()">Löschen</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const tileSize = 40;
const world = {}; // key: "x,y" -> blockType

// Blockarten
const blockTypes = {
    grass: "#00aa00",
    stone: "#777777",
    wood: "#8b5a2b"
};

function setBlock(x, y, type) {
    world[`${x},${y}`] = type;
    // Quest: Baue 10 Blöcke
    quests[0].progress++;
}

function removeBlock(x, y) {
    delete world[`${x},${y}`];
}

function drawWorld() {
    for (const key in world) {
        const [x, y] = key.split(",").map(Number);
        ctx.fillStyle = blockTypes[world[key]] || "#00aa00";
        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }
}

// Spieler
const player = {
    x: 5 * tileSize,
    y: 5 * tileSize,
    vx: 0,
    vy: 0,
    w: 30,
    h: 40,
    onGround: false,
    hp: 10
};

const keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Maus: Blöcke setzen / entfernen
canvas.addEventListener("mousedown", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const x = Math.floor(mx / tileSize);
    const y = Math.floor(my / tileSize);

    if (e.button === 0) {
        let type = "grass";
        if (e.shiftKey) type = "stone";
        if (e.ctrlKey) type = "wood";
        setBlock(x, y, type);
    }
});
canvas.addEventListener("contextmenu", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const x = Math.floor(mx / tileSize);
    const y = Math.floor(my / tileSize);
    removeBlock(x, y);
});

// Physik Spieler
function physics() {
    player.vy += 0.5;

    if (keys["a"] || keys["ArrowLeft"]) player.vx = -3;
    else if (keys["d"] || keys["ArrowRight"]) player.vx = 3;
    else player.vx = 0;

    if ((keys["w"] || keys["ArrowUp"]) && player.onGround) {
        player.vy = -10;
        player.onGround = false;
    }

    player.x += player.vx;
    player.y += player.vy;

    const footX = Math.floor(player.x / tileSize);
    const footY = Math.floor((player.y + player.h) / tileSize);

    if (world[`${footX},${footY}`]) {
        player.y = footY * tileSize - player.h;
        player.vy = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }
}

function drawPlayer() {
    ctx.fillStyle = "yellow";
    ctx.fillRect(player.x, player.y, player.w, player.h);
}

// Feinde
const enemies = [
    { x: 300, y: 200, vx: 1, vy: 0, w: 30, h: 30, alive: true }
];

// Tag-Nacht
let timeOfDay = 0;        // 0–1
const dayLength = 24000;  // 24 Sekunden

function getDarkness() {
    return Math.sin(timeOfDay * Math.PI); // 0 hell, 1 dunkel
}

function drawDayNight() {
    const darkness = getDarkness();
    ctx.fillStyle = `rgba(0, 0, 50, ${darkness * 0.6})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// Wetter
let weather = "clear"; // clear, rain, snow
let weatherIntensity = 0; // 0–1
let particles = [];

setInterval(() => {
    const r = Math.random();

    if (r < 0.6) {
        weather = "clear";
        weatherIntensity = 0;
    } else if (r < 0.85) {
        weather = "rain";
        weatherIntensity = Math.random() * 0.7 + 0.3;
    } else {
        weather = "snow";
        weatherIntensity = Math.random() * 0.7 + 0.3;
    }
}, 15000);

function spawnWeatherParticles() {
    if (weather === "clear") return;

    for (let i = 0; i < 5 * weatherIntensity; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: -10,
            vx: weather === "snow" ? (Math.random() - 0.5) * 0.5 : 0,
            vy: weather === "snow" ? 1 + Math.random() * 1 : 8 + Math.random() * 4,
            size: weather === "snow" ? 3 : 2
        });
    }
}

function updateWeatherParticles() {
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
    });
    particles = particles.filter(p => p.y < canvas.height + 20);
}

function drawWeatherParticles() {
    if (weather === "rain") ctx.fillStyle = "rgba(150,150,255,0.7)";
    if (weather === "snow") ctx.fillStyle = "white";

    particles.forEach(p => {
        ctx.fillRect(p.x, p.y, p.size, p.size * (weather === "rain" ? 4 : 1));
    });
}

function drawClouds() {
    if (weather === "clear") return;
    const alpha = weatherIntensity * 0.3;
    ctx.fillStyle = `rgba(200,200,200,${alpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// Wetter beeinflusst Feinde
function getEnemyModifiers() {
    let speed = 1;
    let jump = 1;
    let push = 0;

    if (weather === "rain") {
        speed = 1.4 * weatherIntensity;
        jump = 0.8;
    }

    if (weather === "snow") {
        speed = 0.6;
        jump = 0.9;
    }

    if (weather === "snow" || weather === "rain") {
        push = (Math.random() - 0.5) * 0.2 * weatherIntensity;
    }

    if (getDarkness() > 0.4) {
        speed *= 1.2;
        jump *= 1.1;
    }

    return { speed, jump, push };
}

function updateEnemies() {
    const mod = getEnemyModifiers();

    enemies.forEach(e => {
        if (!e.alive) return;

        e.vy += 0.4;
        e.x += e.vx * mod.speed;
        e.y += e.vy;

        e.x += mod.push;

        const footX = Math.floor(e.x / tileSize);
        const footY = Math.floor((e.y + e.h) / tileSize);
        if (world[`${footX},${footY}`]) {
            e.y = footY * tileSize - e.h;
            e.vy = 0;

            if (Math.random() < 0.01 * mod.jump) {
                e.vy = -8 * mod.jump;
            }
        }

        const frontX = Math.floor((e.x + (e.vx > 0 ? e.w : -1)) / tileSize);
        const frontY = Math.floor((e.y + e.h / 2) / tileSize);
        if (world[`${frontX},${frontY}`]) e.vx *= -1;

        // Spieler-Kollision
        if (player.x < e.x + e.w &&
            player.x + player.w > e.x &&
            player.y < e.y + e.h &&
            player.y + player.h > e.y) {

            if (player.vy > 0) {
                if (e.alive) {
                    e.alive = false;
                    player.vy = -8;
                    // Quest: Feind besiegt
                    quests[1].progress++;
                }
            } else {
                player.hp -= 1 * mod.speed;
            }
        }
    });
}

function drawEnemies() {
    enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = "purple";
        ctx.fillRect(e.x, e.y, e.w, e.h);
    });
}

// Quests
let quests = [
    { id: 1, text: "Baue 10 Blöcke", progress: 0, goal: 10 },
    { id: 2, text: "Besiege 1 Feind", progress: 0, goal: 1 }
];

function drawQuests() {
    ctx.fillStyle = "white";
    ctx.font = "16px Arial";
    let y = 25;

    quests.forEach(q => {
        const done = q.progress >= q.goal;
        const status = done ? "✔" : `${q.progress}/${q.goal}`;
        ctx.fillText(q.text + ": " + status, 20, y);
        y += 20;
    });

    ctx.fillText("HP: " + Math.max(0, player.hp), 20, y + 10);
}

// Speichern / Laden / Autosave
function saveLevel() {
    const saveObj = {
        world: world,
        playerX: player.x,
        playerY: player.y,
        playerHp: player.hp,
        timeOfDay,
        weather,
        weatherIntensity,
        quests
    };
    localStorage.setItem("levelData", JSON.stringify(saveObj));
    alert("Level gespeichert!");
}

function loadLevel() {
    const data = localStorage.getItem("levelData");
    if (data) {
        const loaded = JSON.parse(data);

        for (const key in world) delete world[key];
        Object.assign(world, loaded.world || {});

        if (loaded.playerX !== undefined) player.x = loaded.playerX;
        if (loaded.playerY !== undefined) player.y = loaded.playerY;
        if (loaded.playerHp !== undefined) player.hp = loaded.playerHp;

        if (loaded.timeOfDay !== undefined) timeOfDay = loaded.timeOfDay;
        if (loaded.weather !== undefined) weather = loaded.weather;
        if (loaded.weatherIntensity !== undefined) weatherIntensity = loaded.weatherIntensity;
        if (loaded.quests !== undefined) quests = loaded.quests;

        alert("Level geladen!");
    } else {
        alert("Kein gespeichertes Level gefunden.");
    }
}

function clearLevel() {
    localStorage.removeItem("levelData");
    alert("Level gelöscht!");
}

// Autosave alle 5 Sekunden
setInterval(() => {
    const saveObj = {
        world: world,
        playerX: player.x,
        playerY: player.y,
        playerHp: player.hp,
        timeOfDay,
        weather,
        weatherIntensity,
        quests
    };
    localStorage.setItem("levelData", JSON.stringify(saveObj));
    console.log("Autosave durchgeführt");
}, 5000);

// Hauptloop
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Zeit
    timeOfDay += 1 / dayLength;
    if (timeOfDay > 1) timeOfDay = 0;

    physics();
    updateEnemies();

    spawnWeatherParticles();
    updateWeatherParticles();

    drawWorld();
    drawEnemies();
    drawPlayer();
    drawQuests();
    drawDayNight();
    drawClouds();
    drawWeatherParticles();

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
