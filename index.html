<html>
<head>

    body { margin: 0; overflow: hidden; background: #222; }
    canvas { background: #66aaff; display: block; }

        position: fixed;
        top: 10px;

        z-index: 10;
    }

        margin-right: 5px;
    }

<body>
<canvas id="game"></canvas>
<div id="ui">
    <button onclick="saveLevel()">Speichern</button>
    <button onclick="loadLevel()">Laden</button>
    <button onclick="clearLevel()">Löschen</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", () => {
    resize();
    generateGround();
});
resize();

const tileSize = 40;
const world = {}; // "x,y" -> blockType

// Blockarten
const blockTypes = {
    grass: "#00aa00",
    stone: "#777777",
    wood: "#8b5a2b",
    sand: "#d2b48c",
    snow: "#e0f7ff"
};

// Biome
const biomes = [
    {
        name: "forest",
        color: "#00aa00",
        ground: "grass",
        weatherChance: { rain: 0.4, snow: 0.1 },
        enemySpeed: 1
    },
    {
        name: "desert",
        color: "#d2b48c",
        ground: "sand",
        weatherChance: { rain: 0.05, snow: 0 },
        enemySpeed: 1.3
    },
    {
        name: "snow",
        color: "#e0f7ff",
        ground: "snow",
        weatherChance: { rain: 0.1, snow: 0.6 },
        enemySpeed: 0.7
    },
    {
        name: "mountains",
        color: "#888888",
        ground: "stone",
        weatherChance: { rain: 0.2, snow: 0.3 },
        enemySpeed: 0.9
    }
];

function getBiomeAt(xTile) {
    const index = Math.floor(xTile / 20) % biomes.length;
    return biomes[(index + biomes.length) % biomes.length];
}

// Boden
function generateGround() {
    const groundY = Math.floor(canvas.height / tileSize) - 2;
    for (let x = 0; x < Math.floor(canvas.width / tileSize); x++) {
        const biome = getBiomeAt(x);
        world[`${x},${groundY}`] = biome.ground;
        world[`${x},${groundY + 1}`] = biome.ground;
    }
}

function setBlock(x, y, type) {
    world[`${x},${y}`] = type;
    quests[0].progress++;
}

function removeBlock(x, y) {
    const groundY = Math.floor(canvas.height / tileSize) - 2;
    if (y >= groundY) return; // Boden geschützt
    delete world[`${x},${y}`];
}

function drawWorld() {
    for (const key in world) {
        const [x, y] = key.split(",").map(Number);
        const biome = getBiomeAt(x);
        ctx.fillStyle = blockTypes[world[key]] || biome.color;
        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }
}

// Spieler
const player = {
    x: 5 * tileSize,
    y: 5 * tileSize,
    vx: 0,
    vy: 0,
    w: 30,
    h: 40,
    onGround: false,
    hp: 10
};

const keys = {};
document.addEventListener("keydown", e => {
    keys[e.key] = true;
});
document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

// 4-Richtungen-Bausystem (Option B)
let buildDir = "down"; // Standard

document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") buildDir = "up";
    if (e.key === "ArrowDown") buildDir = "down";
    if (e.key === "ArrowLeft") buildDir = "left";
    if (e.key === "ArrowRight") buildDir = "right";

    const px = Math.floor((player.x + player.w / 2) / tileSize);
    const py = Math.floor((player.y + player.h / 2) / tileSize);

    let tx = px;
    let ty = py;

    if (buildDir === "up") ty -= 1;
    if (buildDir === "down") ty += 1;
    if (buildDir === "left") tx -= 1;
    if (buildDir === "right") tx += 1;

    if (e.key === "f") setBlock(tx, ty, "grass");
    if (e.key === "g") setBlock(tx, ty, "stone");
    if (e.key === "h") setBlock(tx, ty, "wood");
    if (e.key === "r") removeBlock(tx, ty);
});

// Physik Spieler
function physics() {
    player.vy += 0.5;

    if (keys["a"] || keys["A"] || keys["ArrowLeft"]) player.vx = -3;
    else if (keys["d"] || keys["D"] || keys["ArrowRight"]) player.vx = 3;
    else player.vx = 0;

    if ((keys["w"] || keys["W"] || keys["ArrowUp"]) && player.onGround) {
        player.vy = -10;
        player.onGround = false;
    }

    player.x += player.vx;
    player.y += player.vy;

    const footX = Math.floor(player.x / tileSize);
    const footY = Math.floor((player.y + player.h) / tileSize);

    if (world[`${footX},${footY}`]) {
        player.y = footY * tileSize - player.h;
        player.vy = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }
}

function drawPlayer() {
    ctx.fillStyle = "yellow";
    ctx.fillRect(player.x, player.y, player.w, player.h);
}

// Feinde
const enemies = [
    { x: 300, y: 200, vx: 1, vy: 0, w: 30, h: 30, alive: true }
];

// Tag-Nacht
let timeOfDay = 0;
const dayLength = 24000;

function getDarkness() {
    return Math.sin(timeOfDay * Math.PI);
}

function drawDayNight() {

    ctx.fillRect(0, 0, canvas.width, canvas.height
