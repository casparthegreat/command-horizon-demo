<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D Bau-Spiel – Final</title>
<style>
    body { margin: 0; overflow: hidden; background: #222; }
    canvas { background: #66aaff; display: block; }
    #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
    }
    #ui button {
        margin-right: 5px;
    }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
    <button onclick="saveLevel()">Speichern</button>
    <button onclick="loadLevel()">Laden</button>
    <button onclick="clearLevel()">Löschen</button>
</div>

<script>
// ---------------------------------------------------------
// CANVAS SETUP
// ---------------------------------------------------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", () => {
    resize();
    generateGround();
});
resize();

// ---------------------------------------------------------
// WELT & BLOCKTYPEN
// ---------------------------------------------------------
const tileSize = 40;
const world = {}; // "x,y" -> blockType

const blockTypes = {
    grass: "#00aa00",
    stone: "#777777",
    wood: "#8b5a2b",
    sand: "#d2b48c",
    snow: "#e0f7ff"
};

// ---------------------------------------------------------
// BIOME
// ---------------------------------------------------------
const biomes = [
    {
        name: "forest",
        color: "#00aa00",
        ground: "grass",
        weatherChance: { rain: 0.4, snow: 0.1 },
        enemySpeed: 1
    },
    {
        name: "desert",
        color: "#d2b48c",
        ground: "sand",
        weatherChance: { rain: 0.05, snow: 0 },
        enemySpeed: 1.3
    },
    {
        name: "snow",
        color: "#e0f7ff",
        ground: "snow",
        weatherChance: { rain: 0.1, snow: 0.6 },
        enemySpeed: 0.7
    },
    {
        name: "mountains",
        color: "#888888",
        ground: "stone",
        weatherChance: { rain: 0.2, snow: 0.3 },
        enemySpeed: 0.9
    }
];

function getBiomeAt(xTile) {
    const index = Math.floor(xTile / 20) % biomes.length;
    return biomes[(index + biomes.length) % biomes.length];
}

// ---------------------------------------------------------
// BODEN GENERIEREN (FIXED VERSION)
// ---------------------------------------------------------
function generateGround() {
    const groundY = Math.floor(canvas.height / tileSize) - 3;

    for (let x = 0; x < Math.floor(canvas.width / tileSize); x++) {
        const biome = getBiomeAt(x);

        world[`${x},${groundY}`] = biome.ground;
        world[`${x},${groundY + 1}`] = biome.ground;
        world[`${x},${groundY + 2}`] = biome.ground;
    }
}

function setBlock(x, y, type) {
    world[`${x},${y}`] = type;
    quests[0].progress++;
}

function removeBlock(x, y) {
    const groundY = Math.floor(canvas.height / tileSize) - 3;
    if (y >= groundY) return; // Boden geschützt
    delete world[`${x},${y}`];
}

function drawWorld() {
    for (const key in world) {
        const [x, y] = key.split(",").map(Number);
        const biome = getBiomeAt(x);
        ctx.fillStyle = blockTypes[world[key]] || biome.color;
        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }
}

// ---------------------------------------------------------
// SPIELER
// ---------------------------------------------------------
const player = {
    x: 5 * tileSize,
    y: 2 * tileSize,   // FIX: Spieler spawnt sichtbar
    vx: 0,
    vy: 0,
    w: 30,
    h: 40,
    onGround: false,
    hp: 10
};

const keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// ---------------------------------------------------------
// 4-RICHTUNGEN-BAUSYSTEM (OPTION B)
// ---------------------------------------------------------
let buildDir = "down";

document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") buildDir = "up";
    if (e.key === "ArrowDown") buildDir = "down";
    if (e.key === "ArrowLeft") buildDir = "left";
    if (e.key === "ArrowRight") buildDir = "right";

    const px = Math.floor((player.x + player.w / 2) / tileSize);
    const py = Math.floor((player.y + player.h / 2) / tileSize);

    let tx = px;
    let ty = py;

    if (buildDir === "up") ty -= 1;
    if (buildDir === "down") ty += 1;
    if (buildDir === "left") tx -= 1;
    if (buildDir === "right") tx += 1;

    if (e.key === "f") setBlock(tx, ty, "grass");
    if (e.key === "g") setBlock(tx, ty, "stone");
    if (e.key === "h") setBlock(tx, ty, "wood");
    if (e.key === "r") removeBlock(tx, ty);
});
