<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Red vs Black – Star Battle</title>
  <style>
    body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { background: #222; border: 3px solid #fff; }
  </style>
</head>
<body>
<canvas id="game" width="800" height="400"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

const FLOOR = 350;
const GRAVITY = 0.6;

const player = { x: 80, y: FLOOR, w: 30, h: 30, vx: 0, vy: 0, speed: 4, onGround: true, color: "red" };
const enemy  = { x: 650, y: FLOOR, w: 30, h: 30, vx: -2, color: "black" };

let stars = [];
let keys = {};
let score = 0;
let gameOver = false;

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup",   e => keys[e.key] = false);

function shoot(dir) {
  stars.push({ x: player.x + 15, y: player.y - 15, r: 6, vx: dir * 7 });
}

function updatePlayer() {
  player.vx = 0;
  if (keys["a"]) player.vx = -player.speed;
  if (keys["d"]) player.vx =  player.speed;

  if ((keys["w"] || keys[" "]) && player.onGround) {
    player.vy = -12;
    player.onGround = false;
  }

  player.x += player.vx;
  player.vy += GRAVITY;
  player.y += player.vy;

  if (player.y >= FLOOR) {
    player.y = FLOOR;
    player.vy = 0;
    player.onGround = true;
  }
}

function updateEnemy() {
  enemy.x += enemy.vx;
  if (enemy.x < 400 || enemy.x > 760) enemy.vx *= -1;

  if (collide(player, enemy)) gameOver = true;
}

function updateStars() {
  if (keys["j"] && !keys["_shotR"]) { shoot(1); keys["_shotR"] = true; }
  if (!keys["j"]) keys["_shotR"] = false;

  if (keys["k"] && !keys["_shotL"]) { shoot(-1); keys["_shotL"] = true; }
  if (!keys["k"]) keys["_shotL"] = false;

  stars.forEach(s => s.x += s.vx);
  stars = stars.filter(s => s.x > -20 && s.x < 820);

  stars.forEach((s, i) => {
    if (circleRect(s, enemy)) {
      score++;
      enemy.x = 650;
      enemy.vx = (Math.random() > 0.5 ? 1 : -1) * 2;
      stars.splice(i, 1);
    }
  });
}

function collide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y - a.h < b.y && a.y > b.y - b.h;
}

function circleRect(c, r) {
  const cx = Math.max(r.x, Math.min(c.x, r.x + r.w));
  const cy = Math.max(r.y - r.h, Math.min(c.y, r.y));
  const dx = c.x - cx;
  const dy = c.y - cy;
  return dx*dx + dy*dy < c.r*c.r;
}

function drawStar(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "yellow";
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = i * (Math.PI * 2) / 5 - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    const a2 = a + Math.PI / 5;
    ctx.lineTo(Math.cos(a2) * (r/2), Math.sin(a2) * (r/2));
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, c.width, c.height);

  ctx.fillStyle = "#555";
  ctx.fillRect(0, FLOOR + 20, c.width, 40);

  ctx.fillStyle = "red";
  ctx.fillRect(player.x, player.y - player.h, player.w, player.h);

  ctx.fillStyle = "black";
  ctx.fillRect(enemy.x, enemy.y - enemy.h, enemy.w, enemy.h);

  stars.forEach(s => drawStar(s.x, s.y, s.r));

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 25);

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText("GAME OVER", 300, 200);
  }
}

function loop() {
  if (!gameOver) {
    updatePlayer();
    updateEnemy();
    updateStars();
  }
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
